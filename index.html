<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
<meta name="color-scheme" content="dark" />
<meta name="description" content="CAUSTIC — photoreal drag racing that runs on anything. Hand-written WebGL2 deferred renderer, procedural cars, procedural audio." />
<title>CAUSTIC</title>
<link rel="stylesheet" href="/src/ui/styles.css" />
</head>
<body>
  <div id="app">
    <canvas id="view" aria-label="Race view"></canvas>
    <div id="hud">
      <div class="panel" id="err"></div>
      <div class="panel" id="stage">CAUSTIC</div>
      <div class="panel" id="rpm">
        <span id="rpmv">0</span> rpm
        <div id="bar"><div id="fill"></div></div>
      </div>
      <div class="panel" id="speed">
        <div class="val" id="speedv">0</div>
        <div class="unit">KM/H</div>
      </div>
      <div class="panel" id="diag">—</div>
    </div>
  </div>
  <noscript>CAUSTIC requires JavaScript and a WebGL2-capable browser.</noscript>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
